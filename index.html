<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>长资源</title>
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="长资源">
<meta name="description" content="长资源 · 4K 在线影视">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: #0b0f14;
    color: #e8edf2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .splash { text-align: center; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .logo {
    width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 22px;
    background: linear-gradient(160deg, #161d26 0%, #0c1118 100%);
    border: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 44px rgba(0,0,0,.5);
  }
  .logo svg { width: 44px; height: 44px; }
  .brand { font-size: 22px; font-weight: 600; letter-spacing: .5em; text-indent: .5em; color: #f2f5f8; }
  .tag { margin-top: 9px; font-size: 12px; color: #7d8a99; letter-spacing: .18em; }
  .spinner {
    margin: 36px auto 0; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.12); border-top-color: #f0b429;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { margin-top: 18px; font-size: 12px; color: #55616e; }
  .enter-btn {
    display: inline-block;
    margin-top: 34px;
    padding: 13px 46px;
    border: 0; border-radius: 999px;
    background: #f0b429; color: #14181f;
    font-size: 17px; font-weight: 600; letter-spacing: .12em;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(240,180,41,.25);
  }
  .enter-btn:active { transform: scale(.97); }
  .tip {
    margin-top: 20px;
    font-size: 13px; line-height: 1.7; color: #8b98a6;
  }
  .tip b { color: #f0b429; font-weight: 600; }
</style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
        <path d="M8 5.5v13l11-6.5z" fill="#f0b429"/>
      </svg>
    </div>
    <div class="brand">长资源</div>
    <div class="tag">4K 在线影视</div>

    <!-- 已安装（standalone）：展示启动画面后自动全屏进入 -->
    <div class="entering" id="entering">
      <div class="spinner"></div>
      <div class="hint">正在进入网站…</div>
    </div>

    <!-- 未安装（浏览器打开）：停留在此页，引导安装 -->
    <div class="browser" id="browser" hidden>
      <button type="button" class="enter-btn" id="enterBtn">进入网站</button>
      <p class="tip">想全屏像 APP 一样使用？<br>点浏览器菜单 <b>「安装应用」</b>，<br>之后从手机桌面图标打开即可。</p>
    </div>
  </div>

<script>
  var TARGET = 'https://www.cz4k.com/';

  // 提前注册 Service Worker，确保 Chrome 识别为可安装 PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  // 已安装（从桌面图标打开）时为 standalone 模式
  var isStandalone = !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (window.navigator.standalone === true) { isStandalone = true; }

  // 自检预览：URL 带 #preview 或 ?preview=1 时停留在本页
  var PREVIEW = /[?&#]preview(=1)?/.test(location.href);

  var entering = document.getElementById('entering');
  var browser = document.getElementById('browser');

  if (isStandalone && !PREVIEW) {
    // 已安装：展示启动画面后全屏进入目标网站
    setTimeout(function () {
      location.replace(TARGET);
    }, 1200);
  } else {
    // 未安装：停留在本页，等待用户安装或直接进入
    entering.hidden = true;
    browser.hidden = false;
    document.getElementById('enterBtn').addEventListener('click', function () {
      location.href = TARGET;
    });
  }
</script>
</body>
</html>
